<div class="login-page">
  <div class="login-page__back">
    <button class="back-button">Voltar ao Cardápio</button>
  </div>

  <div class="login-page__content">
    <div class="login-page__icon">🛡️</div>

    <h1 class="login-page__title">Área do Administrador</h1>
    <p class="login-page__subtitle">Acesse o painel gerencial da loja</p>

    <div class="login-card">
      <div class="form-group">
        <label>Nome da empresa / estabelecimento</label>
        <input type="text" placeholder="Nome da sua empresa cadastrada" [(ngModel)]="empresa" />
      </div>

      <div class="form-group">
        <label>Usuário / Login</label>
        <input type="text" placeholder="Ex: admin" [(ngModel)]="usuario" />
      </div>

      <div class="form-group">
        <label>Senha de acesso</label>

        <div class="password-field">
          <input type="password" placeholder="Digite sua senha" [(ngModel)]="senha" />
          <button type="button" class="password-toggle">Mostrar</button>
        </div>
      </div>

      <button class="login-button" [disabled]="carregando" (click)="logar()"> {{ carregando ? 'Entrando...' : 'Entrar no Painel' }}</button>
      <app-modal [aberto]="modalAberto" [titulo]="tituloModal" [mensagem]="mensagemModal" (fechar)="modalAberto = false"> </app-modal>
    </div>
  </div>
</div>
